# Build + publish the patched 5358 avahi as an arm64 .deb on every source change.
# Docs/README edits are ignored. Publishes to this repo's latest Release under a
# constant asset name, so consumers pull:
#   https://github.com/dpengineering/avahi_0.8/releases/latest/download/avahi-dpea_0.8_arm64.deb
#
# The build runs inside a Debian Bookworm arm64 container on a native arm64
# runner, so the binaries link against Bookworm's glibc and run on a
# 64-bit Raspberry Pi OS (Bookworm) desktop image unchanged.

name: release-deb

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - 'NEWS*'
      - 'AUTHORS*'
  # TEMPORARY: build on PRs too, so the build can be validated before merge.
  # Remove this pull_request block before merging so PRs stop building.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - 'NEWS*'
      - 'AUTHORS*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          # Bookworm ships avahi 0.8, so build-dep pulls almost every dep this
          # source needs. Enable deb-src first.
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's|^deb \(.*\)|deb \1\ndeb-src \1|' /etc/apt/sources.list
          fi
          apt-get update
          apt-get build-dep -y avahi
          # libevent-dev is not in avahi's Debian build-deps (that package skips
          # the libevent binding), but bootstrap.sh does not disable it, so
          # configure hard-errors without it. Install it explicitly.
          apt-get install -y build-essential checkinstall pkg-config libevent-dev

      - name: Build .deb
        run: |
          # bootstrap.sh forwards trailing args to configure, so --prefix=/usr
          # lands the install on the stock avahi paths without editing avahi.
          # Disable the Qt5 and mono bindings: bootstrap.sh does not disable them
          # and build-dep avahi does not supply them, so configure would hard-error.
          # The daemon and the stock Pi OS avahi footprint do not need them.
          ./bootstrap.sh --prefix=/usr --disable-qt5 --disable-mono --disable-monodoc
          make -j"$(nproc)"
          # --fstrans=no disables checkinstall's installwatch path-translation,
          # which is broken on modern arm64/glibc (make install fails with
          # "chmod: cannot access .../libavahi-common.a"). We are root in a
          # throwaway container, so installing to the real FS is fine.
          checkinstall --pkgname=avahi-dpea --pkgversion=0.8 --pkgarch=arm64 \
            --provides=avahi-daemon --fstrans=no --default --nodoc make install
          # normalize to a constant asset name (checkinstall's filename can vary)
          cp "$(ls avahi-dpea*_arm64.deb | head -1)" avahi-dpea_0.8_arm64.deb
          ls -la avahi-dpea_0.8_arm64.deb

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: avahi-deb
          path: avahi-dpea_0.8_arm64.deb
          if-no-files-found: error

  release:
    needs: build
    # never publish a Release from a PR build; only from push to main / dispatch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: avahi-deb

      - name: Publish latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="avahi-${GITHUB_SHA::7}"
          gh release create "$TAG" avahi-dpea_0.8_arm64.deb \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Auto-built 5358 avahi .deb from ${GITHUB_SHA::7}" --latest
